<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="application-name" content="Dither Yuki" />
  <meta name="author" content="L'eco non di Bergamo" />
  <meta name="theme-color" content="#000000" />
  <meta
    name="description"
    content="Tile-based dithering studio for pixel art, palettes, and layered images."
  />
  <title>Dither Yuki</title>
  <style>
    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #boot-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background-color: #000;
      background-image: url('/img/background-img.png');
      background-size: cover;
      background-position: center;
      image-rendering: pixelated;
      pointer-events: none;
      opacity: 1;
      transition: opacity 220ms ease;
    }

    html.is-panel #boot-screen,
    #boot-screen.boot-screen-done {
      opacity: 0;
    }

    .boot-hero {
      width: min(280px, 42vw);
      height: auto;
      image-rendering: pixelated;
      animation: boot-in 280ms ease-out;
    }

    .boot-dither {
      width: 64px;
      height: 8px;
      image-rendering: pixelated;
      background:
        repeating-conic-gradient(#8181FF 0% 25%, #000 0% 50%) 0 0 / 4px 4px;
      clip-path: inset(0 100% 0 0);
      animation: boot-scan 1.1s steps(8, end) infinite;
    }

    @keyframes boot-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes boot-scan {
      0% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }
  </style>
  <script>
    if (/[?&]panel=/.test(location.search)) {
      document.documentElement.classList.add('is-panel');
    }
  </script>
</head>
<body>
  <div id="boot-screen" aria-hidden="true">
    <img class="boot-hero" src="/img/dith.png" alt="" />
    <div class="boot-dither"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
