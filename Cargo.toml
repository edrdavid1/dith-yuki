[workspace]
members = [
    "src-tauri",
    "crates/engine-core",
    "crates/engine-tiles",
    "crates/engine-color",
    "crates/engine-io",
    "crates/engine-project",
    "crates/engine-gpu",
    "crates/engine-registry",
    "crates/dither-zip-safe",
    "crates/dither-thumb",
    "crates/dither-thumb-ffi",
    "platform/windows/dither-shell",
]
exclude = ["fuzz"]

resolver = "2"

[workspace.package]
edition = "2021"

# Hot path crates: keep symbols for debugging but avoid glacial debug codegen.
# `tauri:dev` still uses the dev profile; for full speed use `npm run tauri:dev:release`.
[profile.dev.package.engine-project]
opt-level = 2
[profile.dev.package.engine-tiles]
opt-level = 2
[profile.dev.package.engine-color]
opt-level = 2
[profile.dev.package.engine-gpu]
opt-level = 2
[profile.dev.package.engine-registry]
opt-level = 2
[profile.dev.package.engine-core]
opt-level = 2
[profile.dev.package.engine-io]
opt-level = 2
[profile.dev.package.dither]
opt-level = 2

# Preview / shell components: size-optimized, panic=unwind for catch_unwind across FFI.
[profile.release.package.dither-zip-safe]
opt-level = "s"
[profile.release.package.dither-thumb]
opt-level = "s"
[profile.release.package.dither-thumb-ffi]
opt-level = "s"
