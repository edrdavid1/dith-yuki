[package]
name = "engine-color"
version = "0.1.0"
edition = "2021"
description = "ICC profiles, LUT, linear color space conversions"

[dependencies]
engine-core = { path = "../engine-core" }
engine-io = { path = "../engine-io" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dashmap = "5.5"
png = "0.17"

[[bin]]
name = "gen-srgb-gamut-mesh"
path = "src/bin/gen_srgb_gamut_mesh.rs"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "palette_lut_bench"
harness = false
