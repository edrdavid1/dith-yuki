[package]
name = "engine-color"
version = "0.1.0"
edition = "2021"
description = "ICC profiles, LUT, linear color space conversions"

[features]
default = []
# Expose SoftProofTransform::gpu_lut_volume for a future preview shader path.
gpu-lut = []

[dependencies]
engine-core = { path = "../engine-core" }
engine-io = { path = "../engine-io" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dashmap = "5.5"
png = "0.17"
moxcms = "0.9.1"
# Print-export CMS (native BPC). Soft-proof stays on moxcms; see docs/print-export-cmyk.md.
lcms2 = "6"
log = "0.4"

[[bin]]
name = "gen-srgb-gamut-mesh"
path = "src/bin/gen_srgb_gamut_mesh.rs"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "palette_lut_bench"
harness = false
