[package]
name = "engine-project"
version = "0.1.0"
edition = "2021"
description = "Document model, layers, filters, masks"

[dependencies]
engine-core = { path = "../engine-core" }
engine-registry = { path = "../engine-registry" }
engine-color = { path = "../engine-color" }
engine-tiles = { path = "../engine-tiles" }
engine-gpu = { path = "../engine-gpu" }
engine-io = { path = "../engine-io" }
engine-ascii = { path = "../engine-ascii" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arc-swap = "1.6"
dashmap = "5.5"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
wide = "0.7"
rayon = "1.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
blake3 = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
png = "0.17"
unicode-normalization = "0.1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "compositor_bench"
harness = false

[[bench]]
name = "filter_bench"
harness = false
