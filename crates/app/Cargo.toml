[package]
name = "dither"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = "2"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
engine-core = { path = "../engine-core" }
engine-tiles = { path = "../engine-tiles" }

[build-dependencies]
tauri-build = "2"
