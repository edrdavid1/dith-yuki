[package]
name = "dither"
version = "0.2.0"
edition = "2021"
description = "Tile-based dithering studio for pixel art, palettes, and layered images"
authors = ["L'eco non di Bergamo"]
license = "LicenseRef-FCL-1.0"
homepage = "https://github.com/edrdavid1/dith-yuki"
repository = "https://github.com/edrdavid1/dith-yuki"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
http = "1"
thiserror = "1"
engine-core = { path = "../crates/engine-core" }
engine-tiles = { path = "../crates/engine-tiles" }
engine-project = { path = "../crates/engine-project" }
engine-color = { path = "../crates/engine-color" }
engine-io = { path = "../crates/engine-io" }
engine-gpu = { path = "../crates/engine-gpu" }
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rayon = "1.7"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
block = "0.1"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }
