[package]
name = "dither"
version = "2.0.6-beta"
edition = "2021"
description = "Tile-based dithering studio for pixel art, palettes, and layered images"
authors = ["L'eco non di Bergamo"]
license = "LicenseRef-LNDBL-Software-1.0"
homepage = "https://github.com/edrdavid1/dith-yuki"
repository = "https://github.com/edrdavid1/dith-yuki"

[features]
default = []
channel-direct = [
    "dep:tauri-plugin-updater",
    "dep:reqwest",
    "dep:ed25519-dalek",
    "dep:machine-uid",
    # Use the optional-dep feature name (not `dep:…`) so
    # `cfg(feature = "tauri-macos-haptics")` is set and the plugin registers.
    "tauri-macos-haptics",
]
channel-mas = []
channel-msstore = ["tauri-macos-haptics"]

[dependencies]
# `devtools` stays compiled so local direct builds can open the inspector.
# Store channels ignore the env override (see `webview_debug.rs`).
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
# macOS Taptic Engine. Omitted from the Mac App Store build (private AppKit API).
tauri-macos-haptics = { version = "4", optional = true }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
log = { version = "0.4", features = ["std"] }
http = "1"
thiserror = "1"
engine-core = { path = "../crates/engine-core" }
engine-registry = { path = "../crates/engine-registry" }
engine-tiles = { path = "../crates/engine-tiles" }
engine-project = { path = "../crates/engine-project" }
engine-color = { path = "../crates/engine-color" }
engine-io = { path = "../crates/engine-io" }
engine-gpu = { path = "../crates/engine-gpu" }
image = { version = "0.25", features = ["png", "jpeg", "webp", "bmp", "tiff"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rayon = "1.7"
sysinfo = "0.33"
sha2 = "0.10"
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
ed25519-dalek = { version = "2", optional = true }
machine-uid = { version = "0.5", optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
block = "0.1"
# Custom app icon (SPEC_dither_custom_app_icon) — objc2 stack for NSWorkspace/NSImage.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace", "NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle"] }

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
# Unlocks `tauri::test` (mock_builder / get_ipc_response) for IPC smoke tests.
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
