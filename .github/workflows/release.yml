name: Release

# Tag push: v0.3.0 (stable) or v0.3.0-alpha.1 / v0.3.0-beta.1 / v0.3.0-rc.1 (prerelease).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Shared by macOS + Windows jobs so both attach to the same GitHub Release.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # ── macOS (primary alpha platform) ─────────────────────────────────────────
  macos:
    runs-on: macos-latest
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - name: Require updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required; refusing to publish unsigned updater artifacts."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: |
          npm install
          npm install --prefix frontend

      - name: Detect release channel
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if echo "$TAG" | grep -Eqi '(alpha|beta|rc)(\.|-|$)'; then
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
            echo "title_suffix= (alpha)" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "title_suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Developer certificate
        # No-op when APPLE_CERTIFICATE is unset (closed alpha tolerates Gatekeeper).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set — building unsigned (Gatekeeper warn on first open)."
            if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-dither-yuki-ci-keychain}"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
            CERT_ID="$APPLE_SIGNING_IDENTITY_SECRET"
          else
            CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
            CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          fi
          if [ -z "$CERT_ID" ]; then
            echo "Developer ID Application identity not found after import"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "Imported: $CERT_ID"

      - name: Build and publish (macOS)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Notarization — only effective when all four are set after cert import.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dither Yuki ${{ github.ref_name }}${{ steps.meta.outputs.title_suffix }}
          releaseBody: |
            ## Dither Yuki ${{ github.ref_name }}

            **Channel:** ${{ steps.meta.outputs.channel }}
            **Platforms in this workflow:** macOS (DMG) · Windows (NSIS, when windows job succeeds)

            ### Install (macOS)
            1. Download the `.dmg` from Assets.
            2. Drag **Dither Yuki** to Applications.
            3. If Gatekeeper blocks the app (unsigned / not-yet-notarized builds):
               - Right-click the app → **Open** → confirm **Open**.
               - Or: System Settings → Privacy & Security → **Open Anyway**.

            ### Updates
            From **0.2.0** onward: Help → Check for Updates (Minisign-verified via `latest.json`).

            ### Alpha scope
            Dither / palette studio — not paint, not print/ICC, not video/batch.
            GPU is warm-viewport only; cold compute is opt-in (`DITHER_GPU_PREVIEW=1`).

            ### Feedback
            File a bug with the [bug report template](https://github.com/edrdavid1/dith-yuki/issues/new?template=bug_report.yml).

            See [docs/RELEASE.md](https://github.com/edrdavid1/dith-yuki/blob/main/docs/RELEASE.md) for the release process.
          releaseDraft: false
          # Keep false so /releases/latest (updater endpoint) resolves during alpha-only.
          # Channel is communicated via tag + release title suffix, not GitHub prerelease flag.
          prerelease: false
          args: --bundles app,dmg

  # ── Windows (second wave; same release) ────────────────────────────────────
  windows:
    needs: macos
    runs-on: windows-latest
    # Do not block a successful macOS alpha if the Windows runner fails.
    continue-on-error: true
    steps:
      - name: Require updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required; refusing to publish unsigned updater artifacts."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        shell: bash
        run: |
          npm install
          npm install --prefix frontend

      - name: Build and publish (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dither Yuki ${{ github.ref_name }}
          releaseId: ${{ needs.macos.outputs.release_id }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
