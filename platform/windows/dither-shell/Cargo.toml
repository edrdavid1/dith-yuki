[package]
name = "dither-shell"
version = "0.1.0"
edition = "2021"
description = "Windows Explorer thumbnail provider (COM cdylib) for .dyproj / .dyuki"
license = "FCL-1.0"

[lib]
name = "dither_shell"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
dither-thumb = { path = "../../../crates/dither-thumb" }
dither-zip-safe = { path = "../../../crates/dither-zip-safe" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
windows-implement = "0.60"
winreg = "0.52"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
